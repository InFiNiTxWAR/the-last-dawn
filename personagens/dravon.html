<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DRAVON • Galeria do Herói</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1008;
      background-image: radial-gradient(ellipse at center, #2c1810 0%, #1a1008 60%, #0d0805 100%);
      font-family: 'Cormorant Garamond', 'Georgia', serif;
      color: #f0e2c5;
      min-height: 100vh;
      padding: 2rem;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: linear-gradient(180deg, rgba(44, 24, 16, 0.95) 0%, rgba(30, 18, 10, 0.98) 100%);
      border: 4px solid #8b6914;
      border-radius: 12px;
      box-shadow: 0 0 60px rgba(139, 105, 20, 0.3), inset 0 0 40px rgba(0, 0, 0, 0.8);
      padding: 2rem;
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
      border-bottom: 3px solid #8b6914;
      padding-bottom: 1.5rem;
    }

    .header h1 {
      font-family: 'Cinzel', serif;
      font-size: 2.5rem;
      color: #c9a84c;
      text-shadow: 0 0 20px rgba(201, 168, 76, 0.6);
      letter-spacing: 4px;
    }

    .header .subtitle {
      color: #e8d48b;
      font-style: italic;
      font-size: 1.1rem;
      margin-top: 0.5rem;
    }

    .header .description {
      color: #a89870;
      font-size: 1rem;
      margin-top: 1rem;
      line-height: 1.6;
      font-style: italic;
    }

    .back-btn {
      display: inline-block;
      color: #e8d48b;
      text-decoration: none;
      font-family: 'Cinzel', serif;
      padding: 0.5rem 1.2rem;
      border: 2px solid #8b6914;
      margin-bottom: 1rem;
      transition: 0.3s;
      border-radius: 3px;
    }

    .back-btn:hover {
      background: #4a2c1a;
      color: #fff;
      box-shadow: 0 0 20px rgba(201, 168, 76, 0.4);
    }

    .music-player {
      text-align: center;
      margin: 1rem 0 2rem 0;
      padding: 1rem;
      background: rgba(15, 8, 4, 0.8);
      border: 2px solid #8b6914;
      border-radius: 8px;
    }

    .music-player button {
      background: linear-gradient(180deg, #4a2c1a 0%, #2c1810 100%);
      border: 2px solid #c9a84c;
      color: #e8d48b;
      padding: 0.6rem 2rem;
      font-family: 'Cinzel', serif;
      font-size: 1rem;
      letter-spacing: 2px;
      cursor: pointer;
      border-radius: 3px;
      transition: 0.3s;
    }

    .music-player button:hover {
      box-shadow: 0 0 25px rgba(201, 168, 76, 0.5);
    }

    .music-player button.playing {
      background: linear-gradient(180deg, #6b1a1a 0%, #3a0a0a 100%);
      border-color: #ff4444;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
    }

    .gallery-item {
      background: rgba(15, 8, 4, 0.9);
      border: 2px solid #8b6914;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .gallery-item:hover {
      border-color: #c9a84c;
      box-shadow: 0 0 25px rgba(201, 168, 76, 0.4);
      transform: translateY(-5px);
    }

    .gallery-item img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      display: block;
    }

    .gallery-item .caption {
      padding: 0.8rem;
      text-align: center;
      color: #e8d48b;
      font-family: 'Cinzel', serif;
      font-size: 0.9rem;
      letter-spacing: 1px;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.95);
      z-index: 3000;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .modal.active {
      display: flex;
    }

    .modal img {
      max-width: 90%;
      max-height: 90%;
      border: 4px solid #c9a84c;
      border-radius: 8px;
      box-shadow: 0 0 60px rgba(201, 168, 76, 0.5);
    }

    .modal .close {
      position: absolute;
      top: 30px;
      right: 40px;
      font-size: 3rem;
      color: #c9a84c;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      body { padding: 1rem; }
      .container { padding: 1.5rem; }
      .header h1 { font-size: 2rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="../index.html" class="back-btn">◄ Retornar às Crônicas</a>

    <div class="header">
      <h1>⚔️ DRAVON</h1>
      <div class="subtitle">Mercenário — A Lâmina Errante</div>
      <div class="description">Identificou Runas Ifritianas ancestrais. Permanece ao lado de Kael durante as batalhas.</div>
    </div>

    <div class="music-player">
      <p style="margin-bottom: 0.5rem; color: #a89870; font-style: italic;">🎵 Tema de DRAVON</p>
      <button id="playBtn" onclick="toggleMusic()">▶ Tocar Tema</button>
      <audio id="bgMusic" loop>
        <source src="../assets/musicas/dravon.mp3" type="audio/mpeg">
      </audio>
    </div>

    <div class="gallery-grid" id="gallery">
      <!-- Imagens carregadas via JavaScript -->
    </div>
  </div>

  <div class="modal" id="modal" onclick="closeModal()">
    <span class="close">&times;</span>
    <img src="" alt="Imagem" id="modalImage">
  </div>

  <script>
    const imagens = [
    { src: '../assets/galeria/dravon/dravon-kael.png', caption: 'Dravon e Kael' },
    { src: '../assets/galeria/dravon/img (17).png', caption: 'Dravon em combate' },
    { src: '../assets/galeria/dravon/img (18).png', caption: 'Dravon vigilante' }
    ];

    const gallery = document.getElementById('gallery');
    const bgMusic = document.getElementById('bgMusic');
    const playBtn = document.getElementById('playBtn');
    let isPlaying = false;

    imagens.forEach(imagem => {
      const item = document.createElement('div');
      item.className = 'gallery-item';
      item.innerHTML = '<img src="' + imagem.src + '" alt="' + imagem.caption + '">' +
        '<div class="caption">' + imagem.caption + '</div>';
      item.addEventListener('click', function () {
        openModal(imagem.src);
      });
      gallery.appendChild(item);
    });

    function toggleMusic() {
      if (isPlaying) {
        bgMusic.pause();
        playBtn.textContent = '▶ Tocar Tema';
        playBtn.classList.remove('playing');
      } else {
        bgMusic.play();
        playBtn.textContent = '⏸ Pausar Tema';
        playBtn.classList.add('playing');
      }
      isPlaying = !isPlaying;
    }

    function openModal(src) {
      const modal = document.getElementById('modal');
      const modalImage = document.getElementById('modalImage');
      modalImage.src = src;
      modal.classList.add('active');
    }

    function closeModal() {
      const modal = document.getElementById('modal');
      modal.classList.remove('active');
    }

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeModal();
    });
  </script>
</body>
</html>
